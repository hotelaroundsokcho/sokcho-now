<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --body:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --glow:#E3A24B;
    --glow-ink:#1B2D36;
  }
  :root[lang^="zh"]{--display:"Noto Sans SC","PingFang SC","Microsoft YaHei","IBM Plex Sans KR",sans-serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei","IBM Plex Sans KR",sans-serif}
  :root[lang="ja"]{--display:"Noto Sans JP","Hiragino Sans","Yu Gothic","IBM Plex Sans KR",sans-serif;--body:"Noto Sans JP","Hiragino Sans","Yu Gothic","IBM Plex Sans KR",sans-serif}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  *,*::before,*::after{box-sizing:inherit}

  /* 시간대 토큰: 새벽(동트기 전 남보라) / 낮(맑은 하늘) / 일몰(노을 자두빛) / 밤(별빛 심야 남색)
     glow = 해당 시간대에 어울리는 핀·강조색, glow-ink = glow 위 글자색 */
  :root[data-time="dawn"]{--bg:#E4BAD3;--ink:#2B2557;--muted:#443D75;--sea:rgba(90,80,170,.24);--line:rgba(43,37,87,.34);--panel:rgba(255,255,255,.42);--glow:#4B3F9E;--glow-ink:#FFF6E8}
  :root[data-time="day"]{--bg:#B6DCF5;--ink:#0A2A45;--muted:#1F4867;--sea:rgba(63,148,214,.42);--line:rgba(10,42,69,.30);--panel:rgba(255,255,255,.5);--glow:#E3A24B;--glow-ink:#1B2D36}
  :root[data-time="dusk"]{--bg:#E8A6A4;--ink:#20183A;--muted:#35254F;--sea:rgba(90,50,110,.22);--line:rgba(32,24,58,.32);--panel:rgba(255,246,236,.42);--glow:#54245A;--glow-ink:#FFF1E4}
  :root[data-time="night"]{--bg:#0F1B32;--ink:#EEF1F8;--muted:#A9B7D0;--sea:rgba(46,84,150,.34);--line:#3A4C72;--panel:rgba(30,50,86,.72);--glow:#F6E6A6;--glow-ink:#10192B}


  /* ---- 하늘 장식층: 시간대별로 서서히 나타남 (읽기에 방해되지 않도록 본문 뒤, 터치 통과) ---- */
  .sky{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden}
  .wrap{position:relative;z-index:1}
  .sky .g,.sky .stars,.sky .clouds,.sky .sunrise,.sky .sunset{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity .8s ease}
  .sky .g-dawn{background:linear-gradient(180deg,#A9B2E8 0%,#C9B4E6 34%,#F6BFCB 62%,#FFD3A6 84%,#FFE6A8 100%)}

  /* 해돋이(새벽): 수평선 아래에서 해가 천천히 떠올라 머문 뒤 사라지고 다시 시작. 해 뒤의 빛무리도 함께 밝아짐 */
  .sunrise .horizon{position:absolute;left:-20%;right:-20%;bottom:-18vh;height:60vh;border-radius:50%;
    background:radial-gradient(ellipse at 50% 60%,rgba(255,196,110,.85) 0%,rgba(255,170,120,.45) 38%,rgba(255,170,120,0) 70%);
    opacity:.55;animation:horizonglow 56s ease-in-out infinite}
  .sunrise .sun{position:absolute;left:50%;bottom:0;margin-left:calc(clamp(96px,24vw,168px) / -2);
    width:clamp(96px,24vw,168px);height:clamp(96px,24vw,168px);border-radius:50%;
    background:radial-gradient(circle at 42% 38%,#FFFBE0 0%,#FFE28A 38%,#FFB347 74%,#FF9440 100%);
    box-shadow:0 0 40px 18px rgba(255,205,110,.55),0 0 120px 60px rgba(255,170,100,.35);
    transform:translateY(-34vh);opacity:1;
    animation:sunrise 56s cubic-bezier(.3,.1,.3,1) infinite}
  @keyframes sunrise{
    0%{transform:translateY(30%) scale(1.25);opacity:0}
    8%{opacity:1}
    68%{transform:translateY(-38vh) scale(.95);opacity:1}
    86%{transform:translateY(-41vh) scale(.92);opacity:1}
    100%{transform:translateY(-43vh) scale(.9);opacity:0}
  }
  @keyframes horizonglow{0%{opacity:.25}68%{opacity:.85}86%{opacity:.8}100%{opacity:.25}}
  /* 일몰: 해가 천천히 내려가 수평선 너머로 잠기고, 내려갈수록 붉게 물들며 빛무리가 짙어짐. 옅은 노을 구름결이 느리게 흐름 */
  .sunset .glowline{position:absolute;left:-20%;right:-20%;bottom:-20vh;height:62vh;border-radius:50%;
    background:radial-gradient(ellipse at 50% 55%,rgba(255,170,120,.75) 0%,rgba(240,140,140,.4) 40%,rgba(240,140,140,0) 72%);
    opacity:.3;animation:glowdeepen 64s ease-in-out infinite}
  .sunset .ssun{position:absolute;left:50%;bottom:0;margin-left:calc(clamp(100px,25vw,176px) / -2);
    width:clamp(100px,25vw,176px);height:clamp(100px,25vw,176px);border-radius:50%;
    background:radial-gradient(circle at 42% 38%,#FFF6D8 0%,#FFD98A 36%,#FFA85A 76%,#FF8A4D 100%);
    box-shadow:0 0 40px 16px rgba(255,190,120,.5),0 0 120px 56px rgba(255,150,120,.32);
    transform:translateY(-30vh);opacity:1;
    animation:sunset 64s cubic-bezier(.45,.05,.55,.95) infinite}
  .sunset .ssun i{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 50% 45%,rgba(255,110,110,.95) 0%,rgba(240,80,110,.9) 100%);opacity:.35;
    animation:sunredden 64s ease-in infinite}
  .sunset .streak{position:absolute;left:0;height:9vh;width:70vw;border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%,rgba(255,236,214,.6) 0%,rgba(255,236,214,0) 70%);
    animation:streakdrift 46s ease-in-out infinite alternate}
  @keyframes sunset{
    0%{transform:translateY(-46vh) scale(.9);opacity:0}
    9%{opacity:1}
    82%{transform:translateY(18%) scale(1.22);opacity:1}
    94%{transform:translateY(60%) scale(1.28);opacity:.9}
    100%{transform:translateY(80%) scale(1.3);opacity:0}
  }
  @keyframes sunredden{0%{opacity:0}30%{opacity:.08}85%{opacity:.75}100%{opacity:.8}}
  @keyframes glowdeepen{0%{opacity:.15}80%{opacity:.85}100%{opacity:.2}}
  @keyframes streakdrift{from{transform:translateX(-14vw)}to{transform:translateX(14vw)}}
  .sky .g-day{background:linear-gradient(180deg,#8CC8EE 0%,#C4E3F8 55%,#DDF0FB 100%)}
  .sky .g-dusk{background:linear-gradient(180deg,#9AA3D0 0%,#C3A2C3 33%,#E8A6A4 60%,#F6BF96 84%,#FAD8A2 100%)}
  .sky .g-night{background:linear-gradient(180deg,#081124 0%,#0F1B32 55%,#17305A 100%)}
  :root[data-time="dusk"] .sky .sunset,
  :root[data-time="dawn"] .sky .g-dawn,
  :root[data-time="dawn"] .sky .sunrise,
  :root[data-time="day"] .sky .g-day,
  :root[data-time="dusk"] .sky .g-dusk,
  :root[data-time="night"] .sky .g-night,
  :root[data-time="night"] .sky .stars,
  :root[data-time="day"] .sky .clouds{opacity:1}

  .stars .c{width:2.4px;height:2.4px;box-shadow:9.4vw 55.3vh 1px 0 rgba(255,255,255,.95),19.3vw 6.0vh 1px 0 rgba(255,255,255,.95),62.3vw 69.7vh 1px 0 rgba(255,255,255,.95),85.5vw 69.7vh 1px 0 rgba(255,255,255,.95),19.3vw 33.3vh 1px 0 rgba(255,255,255,.95),96.1vw 57.0vh 1px 0 rgba(255,255,255,.95),84.2vw 39.6vh 1px 0 rgba(255,255,255,.95),24.4vw 70.7vh 1px 0 rgba(255,255,255,.95),59.0vw 26.5vh 1px 0 rgba(255,255,255,.95),93.7vw 63.4vh 1px 0 rgba(255,255,255,.95),17.5vw 21.7vh 1px 0 rgba(255,255,255,.95),45.1vw 60.1vh 1px 0 rgba(255,255,255,.95),6.3vw 62.3vh 1px 0 rgba(255,255,255,.95),12.6vw 47.7vh 1px 0 rgba(255,255,255,.95),22.0vw 95.2vh 1px 0 rgba(255,255,255,.95),32.7vw 10.0vh 1px 0 rgba(255,255,255,.95),93.8vw 6.1vh 1px 0 rgba(255,255,255,.95),72.0vw 28.1vh 1px 0 rgba(255,255,255,.95),84.5vw 8.6vh 1px 0 rgba(255,255,255,.95),41.9vw 31.7vh 1px 0 rgba(255,255,255,.95);animation:twinkle 2.6s ease-in-out -0.9s infinite}
  .stars .d{width:3px;height:3px;box-shadow:13.0vw 27.8vh 5px 0 rgba(246,230,166,1),67.2vw 93.0vh 5px 0 rgba(246,230,166,1),70.9vw 6.7vh 5px 0 rgba(246,230,166,1),26.5vw 77.7vh 5px 0 rgba(246,230,166,1),93.1vw 77.7vh 5px 0 rgba(246,230,166,1),64.2vw 33.0vh 5px 0 rgba(246,230,166,1),75.5vw 75.1vh 5px 0 rgba(246,230,166,1),13.2vw 41.1vh 5px 0 rgba(246,230,166,1),48.3vw 27.8vh 5px 0 rgba(246,230,166,1);animation:twinkle 4.2s ease-in-out -2.4s infinite}

    clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);

  /* 구름(낮): 뭉게구름 10개가 화면을 가로질러 천천히 떠다님. 위쪽은 크고 선명, 아래쪽은 작고 옅게(글자·핀 가독성 보호) */
  .clouds .cw{position:absolute;left:0;top:0;will-change:transform;
    animation:cfloat 120s linear infinite}
  .clouds .cu{display:block;width:clamp(120px,calc(36vw * var(--k,1)),calc(280px * var(--k,1)));height:auto;
    opacity:var(--o,.9);animation:cbob 9s ease-in-out infinite alternate}
  @keyframes cfloat{from{transform:translate3d(var(--from,-60vw),0,0)}to{transform:translate3d(var(--to,120vw),0,0)}}
  @keyframes cbob{from{transform:translateY(-5px)}to{transform:translateY(6px)}}

  body{
    margin:0;min-height:100%;
    background:var(--bg);color:var(--ink);
    font-family:var(--body);font-size:16px;line-height:1.6;overflow-wrap:break-word;
    transition:background-color .5s ease,color .5s ease;
  }
  :root[lang="ko"] body{word-break:keep-all}
  :root[lang="ja"] body,:root[lang^="zh"] body{line-break:strict}
  .wrap{max-width:480px;margin:0 auto;padding:22px 20px 40px}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  .brand{font-size:14px;color:var(--muted);margin:0}
  .langs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .langs button{
    font:inherit;font-family:var(--display);font-size:14px;font-weight:400;
    color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:4px 13px;cursor:pointer;min-height:40px;
    transition:background-color .3s ease,color .3s ease;
  }
  .langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
  .koname{margin:0;font-size:14px;color:var(--muted)}
  h1{
    font-family:var(--display);font-weight:300;
    font-size:clamp(30px,9vw,44px);line-height:1.22;letter-spacing:-.02em;
    margin:0 0 10px;
  }
  .lede{margin:0 0 22px;color:var(--muted);max-width:30em}

  .times{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 0 10px;border:1px solid var(--line);border-radius:999px;padding:3px}
  .times button{
    font:inherit;font-family:var(--display);font-weight:400;font-size:15px;
    color:var(--muted);background:transparent;border:0;border-radius:999px;
    padding:10px 0 8px;cursor:pointer;position:relative;min-height:48px;
    transition:background-color .3s ease,color .3s ease;
  }
  .times button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
  .times button .now{display:block;font-size:11px;line-height:1;margin-top:3px;height:11px;font-weight:400;opacity:.85}
  .note{min-height:3.2em;margin:0 0 6px;font-size:15px}

  .map{margin:0 -4px 6px}
  .map svg{display:block;width:100%;height:auto}
  .sea{fill:var(--sea);transition:fill .5s ease}
  .ring{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
  .maplabel{font-family:var(--body);font-size:12px;fill:var(--muted)}
  .ringlabel{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
  .hotel-dot{fill:var(--ink)}
  .hotel-halo{fill:var(--glow);opacity:.35}
  .pin{cursor:pointer}
  .pin .disc{fill:var(--bg);stroke:var(--muted);stroke-width:1.2;transition:fill .4s ease,stroke .4s ease}
  .pin .num{font-family:var(--display);font-weight:600;font-size:12px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .pin .halo{fill:var(--glow);opacity:0}
  .pin.on .disc{fill:var(--glow);stroke:var(--glow)}
  .pin.on .num{fill:var(--glow-ink)}

  .pin:focus{outline:none}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.28}50%{transform:scale(1.5);opacity:.08}}

  /* 밤: 켜진 핀(1,2,3…)이 별처럼 반짝임 — 네 갈래 빛살 + 본체 명멸. 핀마다 시작 시점이 달라 동시에 깜박이지 않음 */

  :root[data-time="night"] .pin.on .disc{animation:starbody 3s ease-in-out infinite}

  @keyframes glint{

    50%{opacity:.95;transform:scale(1) rotate(12deg)}
  }
  @keyframes starbody{0%,100%{opacity:.78}50%{opacity:1}}

  .tabs{display:flex;flex-wrap:wrap;gap:0 18px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
  .tabs button{
    font:inherit;font-family:var(--display);font-size:17px;font-weight:400;

  }

  .areas button{

  .areas button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  ol.list{list-style:none;margin:0;padding:0}
  .item{
    display:grid;grid-template-columns:28px 1fr;column-gap:10px;
    padding:16px 0 16px 12px;border-left:3px solid transparent;
    border-bottom:1px solid var(--line);
    transition:border-color .4s ease,opacity .4s ease,background-color .3s ease;
  }
  .item.dim{opacity:.9}
  .item.on{border-left-color:var(--glow)}
  .item.sel{background:var(--panel)}
  .idx{font-family:var(--display);font-weight:300;font-size:24px;line-height:1.1;color:var(--muted)}
  .dist{font-family:var(--display);font-size:14px;font-weight:600;color:var(--muted);margin:0 0 2px}
  .name{
    font-family:var(--display);font-weight:600;font-size:19px;line-height:1.3;margin:0;
    background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;
  }
  .name:focus-visible,.links a:focus-visible,.times button:focus-visible,.tabs button:focus-visible,.areas button:focus-visible,.langs button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
  .why{margin:4px 0 0}
  .links{margin:4px 0 0;display:flex;gap:6px;font-size:15px;flex-wrap:wrap}
  .links a{color:var(--ink);text-underline-offset:4px;display:inline-flex;align-items:center;min-height:44px;padding:0 8px 0 0}
  .check{margin:8px 0 0;font-size:12.5px;color:var(--glow-ink);background:var(--glow);display:inline-block;padding:2px 8px;border-radius:4px}
  .notice{margin:18px 0 6px;padding:10px 12px;border-left:3px solid var(--glow);border-radius:4px;background:var(--panel);color:var(--ink);font-size:15px}
  .reviewbar{display:none;background:var(--glow);color:var(--glow-ink);font-size:13px;padding:6px 10px;border-radius:6px;margin:0 0 16px}
  .review .reviewbar{display:block}

  .foot p{margin:0 0 6px}

    cap:"方角と距離はおおよそのイメージです。正確な場所と所要時間は下の地図リンクでご確認ください。",
    foot2:"所要時間は道路状況や時期によって変わります。襄陽・高城方面は週末や繁忙期に時間がかかることがあります。",
    foot3:"韓国ではGoogleマップの経路案内が制限される場合があります。Naver MapとKakao Mapのリンクも用意しています。",
      foot4:"このページは韓国語から翻訳したもので、不自然な表現が含まれる場合があります。ご不明な点は韓国語の原文をご確認ください。",
    ariaTimes:"時間帯を選ぶ", ariaMap:"ホテルからの距離イメージ図", ariaCats:"カテゴリ", ariaAreas:"エリアを選ぶ",
    now:"今",
    notice:"営業時間と定休日は掲載していません。お出かけ前に、地図リンクで電話番号を確認し、直接お問い合わせください。",
    cats:{spot:"見どころ",food:"グルメ",cafe:"カフェ",move:"移動・買い物"},
    areas:{all:"すべて","속초":"束草","양양":"襄陽","고성":"高城"},
    times:{dawn:["早朝","日の出のころ"],day:["昼","昼の時間帯"],dusk:["夕暮れ","日没のころ"],night:["夜","夜の時間帯"]},
    ring:{1:"徒歩10分以内",2:"車で約10分",3:"車で約20分",4:"車で約30分"},
    linkOrder:[["google","Googleマップ"],["naver","Naver Map"],["kakao","Kakao Map"]],
    noteOn:function(n, phrase){ return phrase + "におすすめの場所が" + n + "か所あります。"; },
    noteNone:function(phrase){ return phrase + "に特におすすめの場所はありません。別の時間帯をお試しください。"; },
    noteEmptyArea:"このエリアにはまだ掲載がありません。別のエリアをお選びください。",
    empty:{
      food:{dawn:"この時間帯におすすめの飲食店はまだ掲載していません。別の時間帯をお試しください。",
            night:"この時間帯におすすめの飲食店はまだ掲載していません。別の時間帯をお試しください。"},
      cafe:{dawn:"この時間帯におすすめのカフェはまだ掲載していません。別の時間帯をお試しください。",
            night:"この時間帯におすすめのカフェはまだ掲載していません。夜は「見どころ」から海辺の散歩を選んでみてください。"}
    },
    pinAria:function(i, name, on){ return i + "番 " + name + (on ? "、この時間帯におすすめ" : ""); }
  };

  var RING_R = {1:42,2:84,3:126,4:165};
  var CX = 170, CY = 210;

  var params = new URLSearchParams(location.search);
  var REVIEW = params.get("review") === "1";
  if (REVIEW) document.getElementById("app").classList.add("review");

  function initialLang(){
    var q = params.get("lang");
    if (LANG_KEYS.indexOf(q) > -1) return q;
    var nav = (navigator.language || "").toLowerCase();
    if (nav.indexOf("ko") === 0) return "ko";
    if (nav.indexOf("zh") === 0) return "zh";
    if (nav.indexOf("ja") === 0) return "ja";
    return "en";
  }
  function autoTime(){
    var h = new Date().getHours();
    if (h >= 4 && h < 8) return "dawn";
    if (h >= 8 && h < 17) return "day";
    if (h >= 17 && h < 20) return "dusk";
    return "night";
  }
  var NOW = autoTime();
  var state = {lang:initialLang(), cat:"spot", time:NOW, area:"all", sel:null, focus:null};

  function T(){ return L[state.lang]; }
  function text(p){
    var tr = state.lang !== "ko" && TX[state.lang] ? TX[state.lang][p.id] : null;
    return {
      name: tr && tr.name ? tr.name : p.name,
      why: tr && tr.why ? tr.why : p.why,
      dist: tr && tr.dist ? tr.dist : (state.lang === "ko" ? p.dist : null)
    };
  }
  function areaName(p){ return T().areas[p.area] || p.area; }

  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, txt){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (txt != null) e.textContent = txt;
    return e;
  }
  function sv(tag, attrs){
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function items(){
    var list = (PLACES[state.cat] || [])
      .map(function(p, i){ return {p:p, i:i, on:p.tags.indexOf(state.time) > -1}; })
      .filter(function(x){ return state.area === "all" || x.p.area === state.area; });
    list.sort(function(x, y){
      if (x.on !== y.on) return x.on ? -1 : 1;
      if (x.p.ring !== y.p.ring) return x.p.ring - y.p.ring;
      return x.i - y.i;
    });
    return list;
  }

  function select(id, scroll){
    state.sel = (state.sel === id) ? null : id;
    render(scroll);
  }

  function applyStatic(){
    var t = T();
    document.documentElement.setAttribute("lang", t.htmlLang);
    document.title = t.title;
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute("data-i18n");
      if (t[key] != null) { nodes[i].textContent = t[key]; nodes[i].hidden = (t[key] === ""); }
    }
    renderLangs();
    document.getElementById("times").setAttribute("aria-label", t.ariaTimes);
    document.getElementById("mapfig").setAttribute("aria-label", t.ariaMap);
    document.getElementById("tabs").setAttribute("aria-label", t.ariaCats);
    document.getElementById("areas").setAttribute("aria-label", t.ariaAreas);
  }

  function renderLangs(){
    var box = document.getElementById("langs");
    box.textContent = "";
    LANG_KEYS.forEach(function(k){
      var b = el("button", {type:"button", lang:(k === "zh" ? "zh-CN" : k), "aria-pressed": String(state.lang === k), "data-fid":"l-" + k}, LANG_LABEL[k]);
      b.addEventListener("click", function(){ state.lang = k; state.focus = "l-" + k; render(false); });
      box.appendChild(b);
    });
  }

  function renderTimes(){
    var box = document.getElementById("times");
    box.textContent = "";
    TIME_KEYS.forEach(function(k){
      var b = el("button", {type:"button","aria-pressed": String(state.time === k), "data-fid":"t-" + k});
      b.appendChild(document.createTextNode(T().times[k][0]));
      b.appendChild(el("span", {"class":"now"}, k === NOW ? T().now : ""));
      b.addEventListener("click", function(){ state.time = k; state.sel = null; state.focus = "t-" + k; render(false); });
      box.appendChild(b);
    });
  }

  function renderTabs(){
    var box = document.getElementById("tabs");
    box.textContent = "";
    CAT_KEYS.forEach(function(k){
      var b = el("button", {type:"button", role:"tab", "aria-selected": String(state.cat === k), "data-fid":"c-" + k}, T().cats[k]);
      b.addEventListener("click", function(){ state.cat = k; state.sel = null; state.focus = "c-" + k; render(false); });
      box.appendChild(b);
    });
  }

  function renderAreas(){
    var box = document.getElementById("areas");
    box.textContent = "";
    AREA_KEYS.forEach(function(k){
      var b = el("button", {type:"button", "aria-pressed": String(state.area === k), "data-fid":"a-" + k}, T().areas[k]);
      b.addEventListener("click", function(){ state.area = k; state.sel = null; state.focus = "a-" + k; render(false); });
      box.appendChild(b);
    });
  }

  function renderNote(list){
    var t = T();
    var n = list.filter(function(x){ return x.on; }).length;
    var phrase = t.times[state.time][1];
    var msg;
    if (list.length === 0) {
      msg = t.noteEmptyArea;
    } else if (n > 0) {
      msg = t.noteOn(n, phrase);
    } else {
      msg = (t.empty[state.cat] && t.empty[state.cat][state.time]) || t.noteNone(phrase);
    }
    document.getElementById("note").textContent = msg;
  }

  function renderPins(list){
    var g = document.getElementById("pins");
    g.textContent = "";
    list.forEach(function(x, idx){
      var rad = x.p.a * Math.PI / 180;
      var r = RING_R[x.p.ring] - 5;
      var cx = CX + r * Math.cos(rad);
      var cy = CY - r * Math.sin(rad);
      var cls = "pin" + (x.on ? " on" : "") + (state.sel === x.p.id ? " sel" : "");
      var pin = sv("g", {"class":cls, transform:"translate(" + cx.toFixed(1) + "," + cy.toFixed(1) + ")",
        role:"button", tabindex:"0", "data-fid":"p-" + x.p.id,
        "aria-label":T().pinAria(idx + 1, text(x.p).name, x.on)});
      pin.appendChild(sv("circle", {r:"18", fill:"transparent"}));
      pin.appendChild(sv("circle", {"class":"halo", r:"15"}));
      var disc;
      if (x.on) {
        // 네 갈래 별빛 (밤에만 CSS로 표시됨). 핀 순서에 따라 깜박임 시작 시점을 어긋나게 함
        var delay = "-" + ((idx * 0.85) % 3).toFixed(2) + "s";
        var spark = sv("path", {"class":"spark",
          d:"M0,-21 Q2.2,-2.2 21,0 Q2.2,2.2 0,21 Q-2.2,2.2 -21,0 Q-2.2,-2.2 0,-21Z"});
        spark.style.animationDelay = delay;
        pin.appendChild(spark);
        disc = sv("circle", {"class":"disc", r:"11"});
        disc.style.animationDelay = delay;
      } else {
        disc = sv("circle", {"class":"disc", r:"11"});
      }
      pin.appendChild(disc);
      var tx = sv("text", {"class":"num"});
      tx.textContent = String(idx + 1);
      pin.appendChild(tx);
      pin.addEventListener("click", function(){ state.focus = "p-" + x.p.id; select(x.p.id, true); });
      pin.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); state.focus = "p-" + x.p.id; select(x.p.id, true); }
      });
      g.appendChild(pin);
    });
  }

  function mapHref(kind, q){
    var enc = encodeURIComponent(q);
    if (kind === "naver") return "https://map.naver.com/p/search/" + enc;
    if (kind === "kakao") return "https://map.kakao.com/link/search/" + enc;
    return "https://www.google.com/maps/search/?api=1&query=" + enc;
  }

  function renderList(list){
    var t = T();
    var ol = document.getElementById("list");
    ol.textContent = "";
    var anyOn = list.some(function(x){ return x.on; });
    list.forEach(function(x, idx){
      var p = x.p;
      var tx = text(p);
      var li = el("li", {"class":"item" + (x.on ? " on" : "") + (anyOn && !x.on ? " dim" : "") + (state.sel === p.id ? " sel" : ""), id:"item-" + p.id});
      li.appendChild(el("div", {"class":"idx","aria-hidden":"true"}, String(idx + 1)));
      var body = el("div");
      body.appendChild(el("p", {"class":"dist"}, (tx.dist || t.ring[p.ring]) + " · " + areaName(p)));
      var nameBtn = el("button", {type:"button", "class":"name", "data-fid":"n-" + p.id}, tx.name);
      nameBtn.addEventListener("click", function(){ state.focus = "n-" + p.id; select(p.id, false); });
      var h = el("h2", {style:"margin:0"});
      h.appendChild(nameBtn);
      body.appendChild(h);
      if (state.lang !== "ko") body.appendChild(el("p", {"class":"koname", lang:"ko"}, p.name));
      body.appendChild(el("p", {"class":"why"}, tx.why));
      var links = el("div", {"class":"links"});
      t.linkOrder.forEach(function(lk){
        links.appendChild(el("a", {href:mapHref(lk[0], p.q), target:"_blank", rel:"noopener noreferrer"}, lk[1]));
      });
      body.appendChild(links);
      if (REVIEW && p.check && p.check.length) {
        body.appendChild(el("p", {"class":"check", lang:"ko"}, "확인 필요: " + p.check.join(" · ")));
      }
      li.appendChild(body);
      ol.appendChild(li);
    });
  }

  function render(scroll){
    document.documentElement.setAttribute("data-time", state.time);
    try{
      var themeBg = {dawn:"#A9B2E8", day:"#8CC8EE", dusk:"#9AA3D0", night:"#081124"}[state.time];
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme && themeBg) metaTheme.setAttribute("content", themeBg);
    }catch(e){}
    applyStatic();
    var list = items();
    renderTimes();
    renderTabs();
    renderAreas();
    renderNote(list);
    renderPins(list);
    renderList(list);
    if (state.focus) {
      var f = document.querySelector('[data-fid="' + state.focus + '"]');
      if (f && f.focus) f.focus({preventScroll:true});
      state.focus = null;
    }
    if (scroll && state.sel) {
      var node = document.getElementById("item-" + state.sel);
      if (node) node.scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"});
    }
  }

  render(false);
})();
</script>
</body>
</html>
